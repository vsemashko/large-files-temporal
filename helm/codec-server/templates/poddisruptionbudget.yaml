{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: {{ include "codec-server.pdb.apiVersion" . }}
kind: PodDisruptionBudget
metadata:
  name: {{ include "codec-server.fullname" . }}
  labels:
    {{- include "codec-server.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "codec-server.selectorLabels" . | nindent 6 }}
{{- end }}
