apiVersion: v1
kind: ConfigMap
metadata:
  name: codec-server-config
  namespace: temporal
data:
  PAYLOAD_SIZE_THRESHOLD_BYTES: "2097152"  # 2MB
  S3_BUCKET: "temporal-large-payloads-prod"
  S3_REGION: "us-east-1"
  CODEC_GRPC_PORT: "9090"
  CODEC_HTTP_PORT: "8080"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: codec-server
  namespace: temporal
  labels:
    app: codec-server
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: grpc
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: codec-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codec-server
  namespace: temporal
  labels:
    app: codec-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: codec-server
  template:
    metadata:
      labels:
        app: codec-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: codec-server-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: codec-server
          image: your-registry/temporal-codec-server:latest
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PAYLOAD_SIZE_THRESHOLD_BYTES
              valueFrom:
                configMapKeyRef:
                  name: codec-server-config
                  key: PAYLOAD_SIZE_THRESHOLD_BYTES
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: codec-server-config
                  key: S3_BUCKET
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: codec-server-config
                  key: S3_REGION
            - name: CODEC_GRPC_PORT
              valueFrom:
                configMapKeyRef:
                  name: codec-server-config
                  key: CODEC_GRPC_PORT
            - name: CODEC_HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: codec-server-config
                  key: CODEC_HTTP_PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: codec-server-config
                  key: LOG_LEVEL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codec-server-sa
  namespace: temporal
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/codec-server-role
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codec-server-hpa
  namespace: temporal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codec-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: codec-server-pdb
  namespace: temporal
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: codec-server
