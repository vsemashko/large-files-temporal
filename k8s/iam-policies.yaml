# AWS IAM Policy for Codec Server
# Attach this to the IAM role associated with codec-server-sa
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iam-policies
  namespace: temporal
data:
  codec-server-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:PutObject",
            "s3:GetObject",
            "s3:DeleteObject",
            "s3:ListBucket"
          ],
          "Resource": [
            "arn:aws:s3:::temporal-large-payloads-prod",
            "arn:aws:s3:::temporal-large-payloads-prod/*"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:HeadBucket",
            "s3:GetBucketLocation"
          ],
          "Resource": "arn:aws:s3:::temporal-large-payloads-prod"
        }
      ]
    }

  cleanup-worker-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:ListBucket",
            "s3:GetObject",
            "s3:DeleteObject"
          ],
          "Resource": [
            "arn:aws:s3:::temporal-large-payloads-prod",
            "arn:aws:s3:::temporal-large-payloads-prod/*"
          ]
        }
      ]
    }

  # Trust relationship for the roles
  trust-relationship.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Federated": "arn:aws:iam::ACCOUNT_ID:oidc-provider/oidc.eks.REGION.amazonaws.com/id/OIDC_ID"
          },
          "Action": "sts:AssumeRoleWithWebIdentity",
          "Condition": {
            "StringEquals": {
              "oidc.eks.REGION.amazonaws.com/id/OIDC_ID:sub": "system:serviceaccount:temporal:SERVICE_ACCOUNT_NAME"
            }
          }
        }
      ]
    }
