# Secrets for Codec Server
# IMPORTANT: Do not commit this file with real secrets!
# Use tools like sealed-secrets, external-secrets, or Vault in production

---
# TLS Certificate Secret
# Generate with: kubectl create secret tls codec-server-tls --cert=cert.pem --key=key.pem -n temporal --dry-run=client -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: codec-server-tls
  namespace: temporal
type: kubernetes.io/tls
data:
  # Base64 encoded TLS certificate
  # Replace with actual certificate: cat cert.pem | base64 -w 0
  tls.crt: LS0tLS1CRUdJTi...  # PLACEHOLDER
  # Base64 encoded TLS private key
  # Replace with actual key: cat key.pem | base64 -w 0
  tls.key: LS0tLS1CRUdJTi...  # PLACEHOLDER

---
# API Key Secret
# Generate with: kubectl create secret generic codec-server-api-key --from-literal=api-key=$(openssl rand -base64 32) -n temporal --dry-run=client -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: codec-server-api-key
  namespace: temporal
type: Opaque
data:
  # Base64 encoded API key
  # Generate with: openssl rand -base64 32 | base64 -w 0
  api-key: UExBQ0VIT0xERVI=  # PLACEHOLDER - Replace with actual key

---
