# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    # Default linters
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Go vet examinations
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Static analysis
    - unused        # Check for unused code

    # Additional recommended linters
    - gofmt         # Check code formatting
    - goimports     # Check import formatting
    - misspell      # Check for misspelled words
    - revive        # Fast, configurable linter
    - gocritic      # Comprehensive Go source code linter
    - gosec         # Security issues
    - unconvert     # Unnecessary type conversions
    - unparam       # Unused function parameters
    - exportloopref # Detect loop variable capture issues
    - nilerr        # Check for nil err return
    - predeclared   # Shadowing of predeclared identifiers
    - sqlclosecheck # SQL rows/statements close check
    - wastedassign  # Wasted assignments
    - whitespace    # Whitespace issues

  disable:
    - typecheck     # Disabled as it can be noisy with generated code

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    check-shadowing: true
    enable-all: true

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/vsemashko/large-files-temporal

  misspell:
    locale: US

  revive:
    severity: warning
    confidence: 0.8
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - unnecessaryBlock
      - commentFormatting

  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104  # Audit errors not checked (covered by errcheck)
      - G307  # Deferring unsafe method (common pattern)

  unused:
    check-exported: false

  unparam:
    check-exported: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  # Exclude specific issues
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - unparam
        - gocritic

    # Exclude protobuf generated files
    - path: \.pb\.go$
      linters:
        - all

    # Exclude main.go from some checks
    - path: cmd/.*main\.go
      linters:
        - gocritic

    # Allow shadowing of 'err' variable
    - text: "shadow: declaration of \"err\""
      linters:
        - govet

    # Allow globals in main packages
    - path: cmd/
      text: "G101:"  # Hardcoded credentials (false positives)

    # Ignore long lines in test files
    - path: _test\.go
      linters:
        - lll

  # Independently from option `exclude` we use default exclude patterns
  exclude-dirs:
    - vendor
    - node_modules
    - pkg/proto

  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*\\.gen\\.go$"
